name: Agentic bug intake

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      event_file:
        description: Repository-relative issue event fixture
        required: true
        default: demo/events/backend-bug.json

permissions:
  contents: read
  issues: write

concurrency:
  group: agentic-triage-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'agent:triage')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install .
      - name: Process live issue intake
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: agentic-triage intake --event "$GITHUB_EVENT_PATH" --database data/agent.db
      - name: Process offline event fixture
        if: github.event_name == 'workflow_dispatch'
        run: >-
          agentic-triage intake --event "${{ inputs.event_file }}"
          --database data/agent.db --no-github
