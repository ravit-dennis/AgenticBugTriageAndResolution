[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bug-triage"
version = "0.1.0"
description = "Bounded agentic workflow for GitHub bug triage and resolution"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.66,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
agentic-triage = "agentic_triage.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
